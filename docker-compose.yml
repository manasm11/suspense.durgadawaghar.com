services:
  app:
    build: .
    ports:
      - "127.0.0.1:8005:8005"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: .
          ignore:
            - data/
            - tmp/
            - .git/
            - bin/
            - "*.exe"
